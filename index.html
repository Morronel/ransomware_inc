<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07060d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ransomware Inc. 2</title>
  <meta name="description" content="A Plague Inc.-style strategy game: run a ransomware crew inside a company network. Learn why MFA, least privilege, segmentation, EDR and offline backups win.">
  <meta property="og:title" content="Ransomware Inc. 2">
  <meta property="og:description" content="Run a ransomware crew: get in, spread unseen, own the domain, steal the data, encrypt. Can you beat the blue team?">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ransomware Inc. 2">
  <meta property="og:url" content="https://morronel.github.io/ransomware_inc/">
  <meta property="og:image" content="https://morronel.github.io/ransomware_inc/assets/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Ransomware Inc. 2: neon network map with encrypted hosts">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ransomware Inc. 2">
  <meta name="twitter:description" content="Run a ransomware crew: get in, spread unseen, own the domain, steal the data, encrypt. Can you beat the blue team?">
  <meta name="twitter:image" content="https://morronel.github.io/ransomware_inc/assets/og-image.jpg">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===================================================== TITLE -->
  <section id="scr-title" class="screen active">
    <div class="title-bg"></div>
    <div class="title-wrap">
      <div class="logo glitch" data-text="RANSOMWARE INC.">RANSOMWARE INC.</div>
      <div class="logo-2">2<small>APT EDITION</small></div>
      <div class="tagline">// <span data-i18n="tagline"></span></div>
      <div class="title-menu">
        <button class="btn btn-primary" id="btn-play" data-i18n="play"></button>
        <button class="btn" id="btn-howto" data-i18n="howto"></button>
        <button class="btn hidden" id="btn-fullscreen">⛶ <span data-i18n="fullscreen"></span></button>
        <button class="btn" id="btn-radio-title"><span class="onair-dot"></span> <span data-i18n="radio"></span></button>
        <a class="btn btn-channel hidden" id="btn-channel" target="_blank" rel="noopener"><img class="ch-logo" src="assets/binary-xor.png" alt=""><span class="ch-text"><small data-i18n="channel"></small><b class="ch-name"></b></span></a>
      </div>
      <div class="lang-switch">
        <button data-lang="en">EN</button><button data-lang="uk">УКР</button>
      </div>
      <p class="disclaimer" data-i18n="disclaimer"></p>
      <div class="version">v<span id="ver"></span></div>
    </div>
  </section>

  <!-- ===================================================== SETUP -->
  <section id="scr-setup" class="screen">
    <header class="bar">
      <button class="icon-btn" id="setup-back" aria-label="back">‹</button>
      <h2 data-i18n="setupTitle"></h2>
      <span></span>
    </header>
    <div class="setup-body">
      <label class="lbl" data-i18n="nameLabel"></label>
      <div class="name-row">
        <input id="crew-name" maxlength="16" spellcheck="false" autocomplete="off">
        <button class="btn btn-small" id="name-reroll">⟳ <span data-i18n="reroll"></span></button>
      </div>
      <label class="lbl" data-i18n="targetLabel"></label>
      <div class="cards" id="target-cards"></div>
      <label class="lbl" data-i18n="vectorLabel"></label>
      <div class="cards" id="vector-cards"></div>
    </div>
    <div class="setup-foot">
      <button class="btn btn-primary btn-wide" id="btn-deploy" data-i18n="deploy"></button>
    </div>
  </section>

  <!-- ===================================================== GAME -->
  <section id="scr-game" class="screen">
    <header class="hud-top">
      <button class="icon-btn" id="btn-menu" aria-label="menu">☰</button>
      <div class="hud-id">
        <div class="hud-name"><span id="hud-name"></span> <em class="access a0" id="hud-access"></em></div>
        <div class="hud-clock" id="hud-clock"></div>
      </div>
      <div class="hud-cpu" id="hud-cpu">◆ <b id="cpu-val">0</b></div>
      <button class="icon-btn speed" id="btn-speed">1×</button>
      <button class="icon-btn" id="btn-radio" aria-label="radio">📻</button>
    </header>
    <div class="ticker" id="ticker"><span class="ticker-tag">◉ LIVE</span><div class="ticker-text"><span id="ticker-text"></span></div></div>
    <div class="map-wrap" id="map-wrap">
      <canvas id="map"></canvas>
      <div class="dept-tip hidden" id="dept-tip"></div>
      <div class="hint hidden" id="hint"></div>
    </div>
    <footer class="hud-bottom">
      <div class="meters">
        <div class="meter m-inf"><div class="m-lbl"><span data-i18n="infected"></span><b id="m-inf-v">0%</b></div><div class="m-bar"><i id="m-inf"></i></div></div>
        <div class="meter m-enc"><div class="m-lbl"><span data-i18n="encrypted"></span><b id="m-enc-v">0%</b></div><div class="m-bar"><i id="m-enc"></i><s id="m-enc-goal"></s></div></div>
        <div class="meter m-exf"><div class="m-lbl"><span data-i18n="exfil"></span><b id="m-exf-v"></b></div><div class="m-bar"><i id="m-exf"></i></div></div>
        <div class="meter m-tac" id="m-tac"><div class="m-lbl"><span data-i18n="tacticsLbl"></span><b id="m-tac-v">0/12</b></div><div class="tac-strip" id="tac-strip"></div></div>
        <div class="meter m-det"><div class="m-lbl"><span data-i18n="detection"></span><b id="m-det-v"></b></div><div class="m-bar"><i id="m-det"></i><s style="left:20%"></s><s style="left:45%"></s><s style="left:70%"></s></div></div>
        <div class="meter m-ir"><div class="m-lbl"><span data-i18n="blueteam"></span><b id="m-ir-v"></b></div><div class="m-bar"><i id="m-ir"></i></div></div>
      </div>
      <div class="actions">
        <button class="btn btn-soc" id="btn-soc"><span data-i18n="socBtn"></span> <em id="soc-badge" class="badge hot hidden"></em></button>
        <button class="btn btn-evolve" id="btn-evolve"><span data-i18n="evolve"></span> <em id="evolve-badge" class="badge hidden"></em></button>
        <button class="btn btn-detonate" id="btn-detonate" disabled>☢ <span id="det-label" data-i18n="detonate"></span></button>
      </div>
    </footer>
  </section>

  <!-- ===================================================== END -->
  <section id="scr-end" class="screen">
    <div class="end-body">
      <div class="end-title glitch" id="end-title" data-text=""></div>
      <p class="end-sub" id="end-sub"></p>
      <img class="share-img" id="share-img" alt="result card">
      <div class="end-actions">
        <button class="btn btn-primary" id="btn-share" data-i18n="share"></button>
        <button class="btn" id="btn-save" data-i18n="saveImg"></button>
        <a class="btn btn-tg" id="btn-tgshare" target="_blank" rel="noopener"><span class="tg-ico">✈</span> <span data-i18n="tgShare"></span></a>
        <a class="btn btn-channel hidden" id="btn-channel-end" target="_blank" rel="noopener"><img class="ch-logo" src="assets/binary-xor.png" alt=""><span class="ch-text"><small data-i18n="channel"></small><b class="ch-name"></b></span></a>
      </div>
      <h3 data-i18n="stats"></h3>
      <div class="stat-grid" id="stat-grid"></div>
      <h3 id="debrief-title"></h3>
      <ul class="debrief" id="debrief"></ul>
      <h3 data-i18n="playbook"></h3>
      <p class="muted" data-i18n="playbookHint"></p>
      <div class="playbook" id="playbook"></div>
      <h3 data-i18n="killchain"></h3>
      <p class="muted" data-i18n="killchainHint"></p>
      <div class="killchain" id="killchain"></div>
      <h3 data-i18n="lesson"></h3>
      <p class="lesson" id="lesson"></p>
      <div class="end-actions">
        <button class="btn btn-primary" id="btn-again" data-i18n="again"></button>
        <button class="btn" id="btn-end-menu" data-i18n="menu"></button>
      </div>
    </div>
  </section>

  <!-- ===================================================== OVERLAYS -->
  <div class="overlay" id="ovl-tree">
    <div class="panel tree-panel">
      <header class="bar">
        <h2 data-i18n="tree"></h2>
        <div class="hud-cpu">◆ <b id="tree-cpu">0</b></div>
        <button class="icon-btn" data-close aria-label="close">✕</button>
      </header>
      <nav class="tabs" id="tree-tabs"></nav>
      <div class="tree-grid-wrap"><svg class="tree-lines" id="tree-lines"></svg><div class="tree-grid" id="tree-grid"></div></div>
      <div class="tree-detail" id="tree-detail"></div>
    </div>
  </div>

  <div class="overlay" id="ovl-soc">
    <div class="panel soc-panel">
      <header class="bar"><h2 data-i18n="socTitle"></h2><span class="soc-stats" id="soc-stats"></span><button class="icon-btn" data-close aria-label="close">✕</button></header>
      <p class="muted soc-note" data-i18n="socNote"></p>
      <ol class="soc-list" id="soc-list"></ol>
    </div>
  </div>

  <div class="overlay" id="ovl-menu">
    <div class="panel small-panel">
      <h2 data-i18n="paused"></h2>
      <button class="btn btn-primary btn-wide" data-close data-i18n="resume"></button>
      <button class="btn btn-wide" id="menu-howto" data-i18n="howto"></button>
      <button class="btn btn-wide" id="menu-radio" data-i18n="radio"></button>
      <button class="btn btn-wide hidden" id="menu-fullscreen">⛶ <span data-i18n="fullscreen"></span></button>
      <div class="row-setting"><span data-i18n="sfx"></span><button class="btn btn-small" id="sfx-toggle"></button></div>
      <div class="row-setting"><span data-i18n="language"></span><div class="lang-switch"><button data-lang="en">EN</button><button data-lang="uk">УКР</button></div></div>
      <button class="btn btn-wide btn-danger" id="menu-quit" data-i18n="quit"></button>
    </div>
  </div>

  <div class="overlay" id="ovl-howto">
    <div class="panel">
      <header class="bar"><h2 data-i18n="howto"></h2><span></span><button class="icon-btn" data-close aria-label="close">✕</button></header>
      <div class="howto-body" id="howto-body"></div>
    </div>
  </div>

  <div class="overlay" id="ovl-radio">
    <div class="panel radio-panel">
      <header class="bar"><h2>NULL.FM <small>66.6 MHz</small></h2><span class="onair" id="radio-onair"></span><button class="icon-btn" data-close aria-label="close">✕</button></header>
      <div class="radio-viz"><canvas id="radio-viz"></canvas></div>
      <div class="radio-now"><small data-i18n="nowPlaying"></small><div id="radio-track"></div><div class="radio-time" id="radio-time"></div></div>
      <div class="radio-ctrl">
        <button class="icon-btn big" id="radio-prev">⏮</button>
        <button class="icon-btn big" id="radio-toggle">▶</button>
        <button class="icon-btn big" id="radio-next">⏭</button>
      </div>
      <input type="range" id="radio-vol" min="0" max="100" value="70">
      <ol class="radio-list" id="radio-list"></ol>
      <p class="muted" data-i18n="radioNote"></p>
    </div>
  </div>

  <div class="overlay" id="ovl-confirm">
    <div class="panel small-panel">
      <h2 class="danger" data-i18n="confirmDetTitle"></h2>
      <p data-i18n="confirmDet"></p>
      <p class="warn" id="confirm-warn"></p>
      <button class="btn btn-detonate btn-wide" id="confirm-yes" data-i18n="yes"></button>
      <button class="btn btn-wide" data-close data-i18n="no"></button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="crt"></div>
</div>

<script src="js/config.js"></script>
<script src="js/labels.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/audio.js"></script>
<script src="js/map.js"></script>
<script src="js/share.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
